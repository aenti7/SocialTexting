name: Build Plugin (no Maven)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Компилируем
      - name: Compile Java
        run: |
          mkdir -p out
          javac -encoding UTF-8 -cp "lib/*" -d out src/main/java/com/example/socialtexting/*.java

      # Создаём JAR
      - name: Create JAR
        run: |
          jar cfm SocialTexting.jar manifest.txt -C out .

      # Сохраняем артефакт (готовый JAR)
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: plugin-jar
          path: SocialTexting.jar
